name: Build Axiom Code APK

on:
  workflow_dispatch:
    inputs:
      icon:
        description: "Launcher icon to bake into the APK"
        required: true
        default: "obsidian_dark"
        type: choice
        options:
          - obsidian_dark
          - ceramic_light
          - midnight_cobalt
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch base source + submodules and apply Axiom Code overlay
        run: |
          if [ -f "Acode-main.zip" ]; then
            unzip -qo Acode-main.zip -d .
            mv Acode-main AxiomCode-main
            if [ -z "$(ls -A AxiomCode-main/codemirror-lsp-client 2>/dev/null)" ]; then
              rm -rf AxiomCode-main/codemirror-lsp-client
              git clone --depth 1 https://github.com/Acode-Foundation/codemirror-lsp-client.git AxiomCode-main/codemirror-lsp-client
            fi
          else
            git clone --depth 1 https://github.com/Acode-Foundation/Acode.git AxiomCode-main
            rm -rf AxiomCode-main/codemirror-lsp-client
            git clone --depth 1 https://github.com/Acode-Foundation/codemirror-lsp-client.git AxiomCode-main/codemirror-lsp-client
          fi

          shopt -s nullglob
          OVERLAY_ZIP=""
          for f in AxiomCode-overlay-api.zip AxiomCode-overlay-v3.zip AxiomCode-overlay-v2.zip AxiomCode-overlay.zip AxiomCode-overlay*.zip; do
            if [ -f "$f" ]; then OVERLAY_ZIP="$f"; break; fi
          done
          echo "Using overlay: $OVERLAY_ZIP"
          if [ -z "$OVERLAY_ZIP" ]; then
            echo "::error::No AxiomCode-overlay*.zip found in repo root."
            ls -la
            exit 1
          fi

          unzip -qo "$OVERLAY_ZIP" -d _overlay
          rm -f AxiomCode-main/src/lib/acode.js
          find AxiomCode-main -type f -name '*ic_acode_*' -print0 | while IFS= read -r -d '' f; do
            dir="$(dirname "$f")"
            base="$(basename "$f")"
            mv -f "$f" "$dir/${base//ic_acode_/ic_axiom_}"
          done || true
          cp -rf _overlay/overlay/. AxiomCode-main/
          rm -rf _overlay

          # Remove any stale file:src/plugins/* entries if upstream moved a plugin to npm
          python3 - << 'EOF'
          import json
          from pathlib import Path

          pkg_path = Path("AxiomCode-main/package.json")
          pkg = json.loads(pkg_path.read_text(encoding="utf-8"))
          for sec in ("dependencies", "devDependencies", "optionalDependencies"):
              deps = pkg.get(sec, {})
              for k, v in list(deps.items()):
                  if isinstance(v, str) and v.startswith("file:"):
                      rel = v[5:]
                      if not (Path("AxiomCode-main") / rel / "package.json").exists():
                          print(f"Removing stale local plugin ref: {k} -> {v}")
                          del deps[k]
          pkg_path.write_text(json.dumps(pkg, indent=2) + "\n", encoding="utf-8")
          EOF
          rm -f AxiomCode-main/package-lock.json

      - name: Apply selected app icon
        env:
          SELECTED_ICON: ${{ inputs.icon || 'obsidian_dark' }}
        run: |
          ICON_FILE="axiom_icon_${SELECTED_ICON}.jpg"
          if [ ! -f "$ICON_FILE" ] && [ -f "AxiomCode-main/branding/icons/$ICON_FILE" ]; then
            ICON_FILE="AxiomCode-main/branding/icons/$ICON_FILE"
          fi
          if [ -f "$ICON_FILE" ]; then
            echo "Applying launcher icon: $ICON_FILE"
            python3 -m pip install --quiet pillow
            python3 - "$ICON_FILE" << 'EOF'
          import sys
          from pathlib import Path
          from PIL import Image, ImageDraw

          img = Image.open(sys.argv[1])
          res_dir = Path("AxiomCode-main/res/android")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in sizes.items():
              out = res_dir / folder
              out.mkdir(parents=True, exist_ok=True)
              sq = img.resize((size, size), Image.Resampling.LANCZOS).convert("RGBA")
              sq.save(out / "ic_launcher.webp", "WEBP", quality=92)
              mask = Image.new("L", (size, size), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, size - 1, size - 1), fill=255)
              rd = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              rd.paste(sq, (0, 0), mask)
              rd.save(out / "ic_launcher_round.webp", "WEBP", quality=92)
          EOF
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies & Cordova setup
        working-directory: AxiomCode-main
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        run: |
          npm install
          npm install -g cordova
          cordova platform add android
          npm run setup

      - name: Build Axiom Code APK
        working-directory: AxiomCode-main
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        run: |
          node utils/storage_manager.mjs y
          npm run build paid dev apk
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../AxiomCode-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxiomCode-debug-apk
          path: AxiomCode-debug.apk
          if-no-files-found: error

      - name: Publish to GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AxiomCode-debug.apk
          
