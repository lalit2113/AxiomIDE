name: Build & Release Axiom IDE APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unpack latest AxiomIDE ZIP if present
        run: |
          ZIP_FILE=$(ls -t AxiomIDE*.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP_FILE" ]; then
            rm -rf app gradle backend settings.gradle.kts build.gradle.kts gradle.properties extracted_src
            unzip -o "$ZIP_FILE" -d extracted_src
            if [ -d "extracted_src/AxiomIDE" ]; then
              cp -rf extracted_src/AxiomIDE/* .
            else
              cp -rf extracted_src/* .
            fi
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK for Release
        run: cp app/build/outputs/apk/debug/*.apk AxiomIDE-v3.0.0.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxiomIDE-v3-apk
          path: AxiomIDE-v3.0.0.apk

      - name: Publish to GitHub Releases (on version tags like v3.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AxiomIDE-v3.0.0.apk
          generate_release_notes: true
          
