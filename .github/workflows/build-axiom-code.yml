name: Build & Release Axiom Code (Acode Fork)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Clone Acode upstream base with submodules and apply Axiom Code overlay
        run: |
          rm -rf build_workspace
          git clone --depth 1 --recurse-submodules https://github.com/Acode-Foundation/Acode.git build_workspace
          if [ -f "AxiomCode-Overlay-v1.0.0.zip" ]; then
            unzip -o AxiomCode-Overlay-v1.0.0.zip -d build_workspace
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Configure Google Maven Central Mirror (avoids HTTP 429)
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/maven-mirror.gradle
          allprojects {
              buildscript {
                  repositories {
                      maven { url "https://maven-central.storage-download.googleapis.com/maven2" }
                  }
              }
              repositories {
                  maven { url "https://maven-central.storage-download.googleapis.com/maven2" }
              }
          }
          EOF

      - name: Install dependencies and setup Cordova
        working-directory: build_workspace
        run: |
          npm install
          npm install -g cordova
          npm run setup

      - name: Build 100% Free & Ad-Free Axiom Code APK (fdroid flavor)
        working-directory: build_workspace
        run: |
          node utils/storage_manager.mjs y
          npm run build paid dev apk fdroid
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../AxiomCode-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxiomCode-v1.0.0-apk
          path: AxiomCode-v1.0.0.apk

      - name: Publish to GitHub Releases
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AxiomCode-v1.0.0.apk
          generate_release_notes: true
          
